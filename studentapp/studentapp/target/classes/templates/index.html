<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background: linear-gradient(135deg, #1a237e, #283593); }
        .card { border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .btn-add { background: linear-gradient(135deg, #27ae60, #2ecc71); border: none; }
        .btn-add:hover { background: linear-gradient(135deg, #219a52, #27ae60); }
        th { background-color: #1a237e; color: white; }
        tr:hover { background-color: #eef2ff; }
        .badge-id { background-color: #1a237e; color: white; padding: 4px 10px; border-radius: 20px; font-size: 13px; }
        .no-results { color: #aaa; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4 py-3 mb-4">
        <span class="navbar-brand fw-bold fs-4">
            <i class="fas fa-graduation-cap me-2"></i> Student Management System
        </span>
    </nav>

    <div class="container">
        <div class="card p-4">

            <!-- Top Bar -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="/add" class="btn btn-add btn-success text-white px-4">
                    <i class="fas fa-plus me-2"></i> Add New Student
                </a>
                <form th:action="@{/}" method="get" class="d-flex gap-2">
                    <input type="text" name="search" class="form-control" placeholder="Search by name..." th:value="${search}" style="width: 250px;"/>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
            </div>

            <!-- Table -->
            <table class="table table-bordered table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Major</th>
                        <th>Grade</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td><span class="badge-id" th:text="${student.id}"></span></td>
                        <td th:text="${student.name}"></td>
                        <td th:text="${student.major}"></td>
                        <td th:text="${student.grade}"></td>
                        <td class="text-center">
                            <a th:href="@{/edit/{id}(id=${student.id})}" class="btn btn-sm btn-primary me-1">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <a th:href="@{/delete/{id}(id=${student.id})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure you want to delete this student?')">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="5" class="text-center no-results py-4">
                            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                            No students found.
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
