<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background: linear-gradient(135deg, #1a237e, #283593); }
        .card { border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .btn-update { background: linear-gradient(135deg, #1565c0, #1976d2); border: none; }
        .btn-update:hover { background: linear-gradient(135deg, #0d47a1, #1565c0); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4 py-3 mb-4">
        <span class="navbar-brand fw-bold fs-4">
            <i class="fas fa-graduation-cap me-2"></i> Student Management System
        </span>
    </nav>

    <div class="container">
        <div class="card p-4" style="max-width: 500px; margin: auto;">
            <h4 class="mb-4 fw-bold text-primary">
                <i class="fas fa-user-edit me-2"></i> Edit Student
            </h4>
            <form th:action="@{/edit/{id}(id=${student.id})}" th:object="${student}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Name</label>
                    <input type="text" class="form-control" th:field="*{name}" placeholder="Enter student name" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Major</label>
                    <input type="text" class="form-control" th:field="*{major}" placeholder="Enter major" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Grade</label>
                    <input type="text" class="form-control" th:field="*{grade}" placeholder="Enter grade" required/>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-update text-white px-4">
                        <i class="fas fa-save me-2"></i> Update
                    </button>
                    <a href="/" class="btn btn-secondary px-4">
                        <i class="fas fa-arrow-left me-2"></i> Back
                    </a>
                </div>
            </form>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
